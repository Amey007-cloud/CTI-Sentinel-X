name: cti-sentinel-final
services:
  mongo:
    image: mongo:7.0
    container_name: cti-final-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run scripts/prepare_env.py first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run scripts/prepare_env.py first}
      MONGO_INITDB_DATABASE: cti_sentinel_final
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - cti_final_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [cti-net]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ameykool/cti-sentinel-ai-api:1.0
    container_name: cti-sentinel-ai-api
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://host.docker.internal:27017/"
      MONGO_DB: cti_sentinel_final
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      VECTOR_SEARCH_MODE: ${VECTOR_SEARCH_MODE:-local}
      VECTOR_INDEX_NAME: ${VECTOR_INDEX_NAME:-cti_vector_index}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 45s
    networks: [cti-net]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ameykool/cti-sentinel-web:1.0
    container_name: cti-sentinel-web
    restart: unless-stopped
    environment:
      MONGO_URI: "mongodb://host.docker.internal:27017/"
      MONGO_DATABASE: cti_sentinel
      CHAT_API_URL: http://backend:8000
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Run scripts/prepare_env.py first}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      EXTERNAL_API_TIMEOUT: ${EXTERNAL_API_TIMEOUT:-12}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      MALWAREBAZAAR_API_KEY: ${MALWAREBAZAAR_API_KEY:-}
      THREATFOX_API_KEY: ${THREATFOX_API_KEY:-}
      URLHAUS_API_KEY: ${URLHAUS_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      MALPEDIA_API_TOKEN: ${MALPEDIA_API_TOKEN:-}
      CUCKOO_API_URL: ${CUCKOO_API_URL:-}
      CTI_MODEL_PATH: /app/models/url_classifier.joblib
      HF_MODEL_REPO_ID: ${HF_MODEL_REPO_ID:-}
      HF_MODEL_REVISION: ${HF_MODEL_REVISION:-main}
      HF_MODEL_FILENAME: ${HF_MODEL_FILENAME:-url_classifier.joblib}
      HF_TOKEN: ${HF_TOKEN:-}
      CUCKOO_API_TOKEN: ${CUCKOO_API_TOKEN:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - cti_final_uploads:/app/data/uploads
      - cti_final_reports:/app/data/reports
      - ./models:/app/models:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4).read()"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    networks: [cti-net]

volumes:
  cti_final_mongo_data:
  cti_final_uploads:
  cti_final_reports:

networks:
  cti-net:
    driver: bridge

{% extends "base.html" %}
{% block title %}CTI Sentinel — Report{% endblock %}
{% block content %}
<section class="page-title"><div class="eyebrow">PERSISTED ANALYSIS</div><h1>Intelligence <span>report</span></h1><p id="report-subtitle">Loading evidence…</p></section>
<div id="report-detail" class="report-detail"><div class="loading-panel"><div class="loader"></div><b>Loading report…</b></div></div>
{% endblock %}
{% block scripts %}<script>
const REPORT_ID={{ report_id|tojson }};
async function loadReport(){const r=await fetch('/api/report/'+encodeURIComponent(REPORT_ID));const data=await r.json();if(!r.ok)throw new Error(data.error||'Report unavailable');const esc=CTI.escape;document.getElementById('report-subtitle').textContent=`${data.title||'Analysis'} · ${data.status||'completed'}`;const result=data.result||data;const file=data.file||result.file||{};const cti=data.cti||result.cti||{};const src=cti.source_results||result.source_results||{};const sandbox=data.sandbox||result.sandbox||{};const behavior=data.behavior||result.behavior||{};document.getElementById('report-detail').innerHTML=`<section class="report-overview panel"><div><span class="panel-kicker">VERDICT</span><div class="big-verdict ${String(data.threat_level||result.threat_level||'unknown').toLowerCase()}">${esc(data.threat_level||result.threat_level||'UNKNOWN')}</div><p>${esc(data.indicator||result.indicator||data.filename||'')}</p></div><div class="score-box"><strong>${esc(data.threat_score??result.threat_score??0)}</strong><span>/100</span></div><div><span class="panel-kicker">STATUS</span><b class="status-large">${esc(data.status||'completed')}</b><small>${CTI.time(data.completed_at||data.submitted_at)}</small></div></section>
${file.sha256?`<section class="panel"><div class="panel-head"><div><span class="panel-kicker">FILE INTAKE</span><h3>${esc(data.filename||file.filename||'Sample')}</h3></div></div><div class="detail-grid"><div><small>SHA256</small><b>${esc(file.sha256)}</b></div><div><small>SHA1</small><b>${esc(file.sha1||'—')}</b></div><div><small>MD5</small><b>${esc(file.md5||'—')}</b></div><div><small>MIME</small><b>${esc(file.mime_type||'—')}</b></div><div><small>Magic type</small><b>${esc(file.magic_type||'—')}</b></div><div><small>Entropy</small><b>${esc(file.entropy??'—')}</b></div></div></section>`:''}
${CTI.mlSignalMarkup(result)}
<section class="panel"><div class="panel-head"><div><span class="panel-kicker">SOURCE CORRELATION</span><h3>Evidence across providers</h3></div></div><div class="source-grid">${Object.entries(src).map(([name,v])=>`<div class="source-evidence"><b>${esc(name)}</b><span class="source-state ${v.match?'match':v.status==='error'?'error':'none'}">${v.match?'MATCH':v.status==='error'?'ERROR':'NO MATCH'}</span><small>${esc(v.message||'')}</small></div>`).join('')||'<div class="empty-state">No source observations recorded.</div>'}</div></section>
${sandbox&&sandbox.status?`<section class="panel"><div class="panel-head"><div><span class="panel-kicker">DYNAMIC ANALYSIS</span><h3>Cuckoo3 sandbox</h3></div><span class="status-large">${esc(sandbox.status)}</span></div><div class="detail-grid"><div><small>Task ID</small><b>${esc(sandbox.task_id||'—')}</b></div><div><small>Engine</small><b>Cuckoo3</b></div><div><small>Analysis state</small><b>${esc(sandbox.status)}</b></div></div></section>`:''}
${behavior&&behavior.processes?`<section class="two-col"><div class="panel"><div class="panel-head"><div><span class="panel-kicker">BEHAVIOR</span><h3>Processes</h3></div></div><div class="code-list">${(behavior.processes||[]).slice(0,40).map(p=>`<div>${esc(typeof p==='string'?p:(p.process_name||p.name||p.pid||JSON.stringify(p)))}</div>`).join('')||'<span>None recorded</span>'}</div></div><div class="panel"><div class="panel-head"><div><span class="panel-kicker">NETWORK</span><h3>Observed hosts / DNS</h3></div></div><div class="code-list">${[...(behavior.hosts||[]),...(behavior.dns||[])].slice(0,50).map(x=>`<div>${esc(typeof x==='string'?x:(x.host||x.domain||x.ip||JSON.stringify(x)))}</div>`).join('')||'<span>None recorded</span>'}</div></div></section>`:''}
<section class="panel"><div class="panel-head"><div><span class="panel-kicker">RAW EVIDENCE</span><h3>Analysis metadata</h3></div></div><details><summary>Show normalized JSON</summary><pre class="json-view">${esc(JSON.stringify(data,null,2))}</pre></details></section>`}
loadReport().catch(e=>{document.getElementById('report-detail').innerHTML=`<div class="notice error">${CTI.escape(e.message)}</div>`});
</script>{% endblock %}
